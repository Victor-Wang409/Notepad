[versions]
agp = "8.10.1"
cardview = "1.0.0"
converterGson = "2.9.0"
json = "20230618"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
kotlinxCoroutinesAndroid = "1.7.3"
lifecycleViewmodelKtx = "2.8.7"
lifecycleProcess = "2.8.7"
loggingInterceptor = "4.11.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
kotlin = "2.0.21"
coreKtx = "1.16.0"
composeBom = "2024.10.00"
composeActivity = "1.9.2"
composeNavigation = "2.8.3"
composeMaterial3 = "1.3.1"
composeUi = "1.7.5"
